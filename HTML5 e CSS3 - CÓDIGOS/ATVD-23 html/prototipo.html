<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFINITY TOKEN</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #222;
        }

        div.principal {
            background-color: rgba(0, 0, 0, 0.884);
            width: 900px;
            height: 600px;
            position: relative;
            border: 5px solid #ff0000;
            border-radius: 8px;
            overflow: hidden;
        }

        .window-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }

        .window-control-btn {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .window-control-btn:hover {
            transform: scale(1.1);
            opacity: 0.8;
        }

        .minimize { background-color: #ffbd4a; }
        .maximize { background-color: #00ca4e; }
        .close { background-color: #ff5e57; }   


        p.bebas-neue-regular {
            font-family: "Bebas Neue", sans-serif;
            font-weight: 400;
            font-style: normal;
            color: #ff0000;
            font-size: 80px;
            position: absolute;
            top: 2%;
            left: 50%;
            transform: translateX(-50%);
            width: fit-content;
            white-space: nowrap;
        }

        .form-container {
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        .form-group {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .form-group label {
            color: #cccccc;
            font-family: Arial, sans-serif;
            font-size: 16px;
            margin-bottom: 5px;
        }

        .form-group input {
            padding: 10px;
            border: 1px solid #ff0000;
            background-color: #333;
            color: white;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #00ff00;
            box-shadow: 0 0 5px rgba(0, 255, 0, 0.7); 
        }

        .btn-iniciar {
            padding: 12px 30px;
            background-color: #ff0000; 
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-family: "Bebas Neue", sans-serif;
            font-size: 24px;
            text-transform: uppercase;
            margin-top: 25px; 
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.7);
        }

        .btn-iniciar:hover {
            background-color: #cc0000; 
            box-shadow: 0 0 12px rgba(255, 0, 0, 0.9); 
        }

        .btn-iniciar:active {
            background-color: #00ff00; 
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.9);
        }
    </style>
</head>
<body>
    <div class="principal">
        <div class="window-controls">
            <div class="window-control-btn minimize" title="Minimizar"></div>
            <div class="window-control-btn maximize" title="Maximizar"></div>
            <div class="window-control-btn close" title="Fechar"></div>
        </div>

        <p class="bebas-neue-regular">INFINITY TOKEN</p>

        <div class="form-container">
            <div class="form-group">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf" placeholder="Ex: 123.456.789-00" required>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Nascimento:</label>
                <input type="date" id="dataNascimento" name="dataNascimento" required>
            </div>

            <button type="submit" class="btn-iniciar">Iniciar</button>
        </div>
    </div>
</body>
</html>
