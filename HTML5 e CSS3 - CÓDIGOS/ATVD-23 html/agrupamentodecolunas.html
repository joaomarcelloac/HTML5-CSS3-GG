<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agrupamento de colunas</title>
    <style>
    body {
        font-family: Arial, Helvetica, sans-serif;
    }   

    table {
        width: 500px;
        border-collapse: collapse;
    }

    caption {
        font-size: 1.3em;
        font-weight: bold;
        padding: px;
    }

    th, td {
        border: 1px solid black;
        padding: 8px;
    }

    col.cnome {
        background-color: aqua;
    }

    col.csexo {
        background-color: aquamarine;
    }
    col.cidade {
        background-color: blueviolet;
    }
    </style>
</head>
<body>
     <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo"> 
            <col class="cidade" span="2">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Ana Maria</td>
            <td>F</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>João Pedro</td>
            <td>M</td>
            <td>32</td>
            <td>Engenheiro</td>
        </tr>
        <tr>
            <td>Camila Rocha</td>
            <td>F</td>
            <td>29</td>
            <td>Designer</td>
        </tr>
        <tr>
            <td>Marcos Silva</td>
            <td>M</td>
            <td>41</td>
            <td>Médico</td>
        </tr>
        <tr>
            <td>Fernanda Lima</td>
            <td>F</td>
            <td>36</td>
            <td>Advogada</td>
        </tr>
        <tr>
            <td>Ricardo Alves</td>
            <td>M</td>
            <td>27</td>
            <td>Professor</td>
        </tr>
    </table>
</body>
</html>
